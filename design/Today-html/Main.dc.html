<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5B4CF0}a:hover{color:#4335D6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; font-family: 'Nunito', system-ui, sans-serif; color: {{t.text}}; display: flex; flex-direction: column">
  <div style="flex-grow: 1; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <p style="margin: 0; font-size: 14px; font-weight: 600; color: {{t.muted}}">Thursday, October 29</p>
        <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px">Hi, Mikhail</h1>
      </div>
      <a href="{{nav.newHabit}}" aria-label="New habit" style="width: 48px; height: 48px; border-radius: 16px; background: #5B4CF0; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </a>
    </div>

    <div style="background: #5B4CF0; color: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 600; color: #E3DFFF">Done today</span>
          <span style="font-size: 28px; font-weight: 800">{{doneCount}} of {{total}}</span>
        </div>
        <span style="font-size: 14px; font-weight: 700; background: #FFD84D; color: #3A2E00; padding: 6px 12px; border-radius: 999px">{{cheer}}</span>
      </div>
      <div style="height: 10px; border-radius: 999px; background: #7B6FF3; overflow: hidden">
        <div style="height: 10px; border-radius: 999px; background: #FFD84D; width: {{pct}}"></div>
      </div>
    </div>

    <h2 style="margin: 4px 0 0; font-size: 18px; font-weight: 800">My habits</h2>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{habits}}" as="item" hint-placeholder-count="5">
        <div style="background: {{t.surface}}; border-radius: 20px; padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 12px">
          <a href="{{nav.habit}}" style="flex-grow: 1; display: flex; align-items: center; gap: 12px; text-decoration: none; color: {{t.text}}; min-height: 44px">
            <span style="width: 44px; height: 44px; border-radius: 14px; background: {{item.tint}}; color: {{item.ink}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 16px; font-weight: 700">{{item.name}}</span>
              <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}; display: flex; align-items: center; gap: 4px">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.flame}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3.3.4 1.5 1.5 2.8 2.5 2.8z"></path></svg>
                {{item.streak}} · {{item.goal}}
              </span>
            </span>
          </a>
          <button type="button" onClick="{{item.toggle}}" aria-label="{{item.label}}" style="width: 44px; height: 44px; border-radius: 14px; border: 2px solid {{item.border}}; background: {{item.bg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0">
            <sc-if value="{{item.done}}" hint-placeholder-val="{{true}}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
            </sc-if>
          </button>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main navigation" style="display: flex; justify-content: space-around; padding: 10px 12px 28px; background: {{t.surface}}; border-top: 1px solid {{t.border}}">
    <a href="{{nav.today}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 80px; min-height: 44px; text-decoration: none; color: {{t.link}}; font-size: 12px; font-weight: 800">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      Today
    </a>
    <a href="{{nav.habits}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 80px; min-height: 44px; text-decoration: none; color: {{t.muted}}; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
      Habits
    </a>
    <a href="{{nav.profile}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 80px; min-height: 44px; text-decoration: none; color: {{t.muted}}; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path></svg>
      Profile
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  tokens(dark) {
    return dark ? {
      bg: '#0F1117', surface: '#1A1D27', surface2: '#242836', raised: '#353A4C', text: '#F2F3F8', muted: '#A3A7BA', border: '#2C3040',
      link: '#A99FFF', flame: '#FFA36B', flameBg: '#3A2414', danger: '#FF8FAA', dangerBorder: '#5A2433', unchecked: '#3A3F52'
    } : {
      bg: '#F4F6FB', surface: '#FFFFFF', surface2: '#F4F6FB', raised: '#FFFFFF', text: '#1B1D2A', muted: '#6B6F80', border: '#E6E8F0',
      link: '#5B4CF0', flame: '#B5470A', flameBg: '#FFF0E6', danger: '#B0264F', dangerBorder: '#F3C2CF', unchecked: '#C9CCDA'
    };
  }
  hue(name, dark) {
    var H = {
      blue: ['#CFE4FF', '#1D5FBF', '#1C3557', '#8EC0FF'],
      yellow: ['#FFE8A3', '#8A5A00', '#4A3A0E', '#FFD66B'],
      green: ['#C9F2DE', '#12704A', '#143D2C', '#6FE0A8'],
      violet: ['#E5DCFF', '#5B4CF0', '#2E2766', '#B3A8FF'],
      pink: ['#FFD6E0', '#B0264F', '#4A1A2A', '#FF8FB0']
    }[name];
    return dark ? { tint: H[2], ink: H[3] } : { tint: H[0], ink: H[1] };
  }
  renderVals() {
    var self = this;
    var dark = (this.props.theme || 'light') === 'dark';
    var t = this.tokens(dark);
    var s = dark ? 'Dark' : '';
    var nav = { today: 'Main' + s + '.dc.html', habits: 'Habits' + s + '.dc.html', profile: 'Profile' + s + '.dc.html', habit: 'Habit' + s + '.dc.html', newHabit: 'NewHabit' + s + '.dc.html' };
    var done = (this.state && this.state.done) || { water: true, read: true, walk: false, calm: true, sugar: false };
    var list = [
      { id: 'water', name: 'Drink water', goal: '8 glasses', streak: 12, hue: 'blue', icon: 'M12 2.7l5.7 5.6a8 8 0 1 1-11.4 0z' },
      { id: 'read', name: 'Read 20 minutes', goal: 'before bed', streak: 5, hue: 'yellow', icon: 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5zM6.5 17A2.5 2.5 0 0 0 4 19.5 2.5 2.5 0 0 0 6.5 22H20v-5' },
      { id: 'walk', name: 'Go for a walk', goal: '30 minutes', streak: 3, hue: 'green', icon: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4' },
      { id: 'calm', name: 'Meditate', goal: '10 min in the morning', streak: 21, hue: 'violet', icon: 'M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10zM2 21c0-3 1.9-5.4 5.2-6' },
      { id: 'sugar', name: 'No sugar', goal: 'all day', streak: 2, hue: 'pink', icon: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM4.9 4.9l14.2 14.2' }
    ];
    var count = 0;
    var habits = list.map(function (h) {
      var d = !!done[h.id];
      if (d) count++;
      var c = self.hue(h.hue, dark);
      return Object.assign({}, h, c, {
        done: d,
        streak: h.streak + ' days',
        bg: d ? '#5B4CF0' : t.surface,
        border: d ? '#5B4CF0' : t.unchecked,
        label: d ? 'Mark as not done' : 'Mark as done',
        toggle: function () {
          var next = Object.assign({}, done);
          next[h.id] = !d;
          self.setState({ done: next });
        }
      });
    });
    return {
      t: t,
      nav: nav,
      habits: habits,
      doneCount: count,
      total: list.length,
      pct: Math.round(count / list.length * 100) + '%',
      cheer: count === list.length ? 'All done!' : 'Keep it up!'
    };
  }
}
</script>
</body>
</html>
