<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All habits</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5B4CF0}a:hover{color:#4335D6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; font-family: 'Nunito', system-ui, sans-serif; color: {{t.text}}; display: flex; flex-direction: column">
  <div style="flex-grow: 1; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px">Habits</h1>
      <a href="{{nav.newHabit}}" aria-label="New habit" style="width: 48px; height: 48px; border-radius: 16px; background: #5B4CF0; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </a>
    </div>

    <div style="display: flex; gap: 8px">
      <button type="button" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: {{t.chipBg}}; color: {{t.chipFg}}; font-family: inherit; font-size: 14px; font-weight: 700">All · 5</button>
      <button type="button" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font-family: inherit; font-size: 14px; font-weight: 700">Morning</button>
      <button type="button" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font-family: inherit; font-size: 14px; font-weight: 700">Evening</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{habits}}" as="item" hint-placeholder-count="5">
        <a href="{{nav.habit}}" style="background: {{t.surface}}; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: {{t.text}}">
          <span style="display: flex; align-items: center; gap: 12px">
            <span style="width: 44px; height: 44px; border-radius: 14px; background: {{item.tint}}; color: {{item.ink}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
            </span>
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 16px; font-weight: 700">{{item.name}}</span>
              <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">{{item.goal}}</span>
            </span>
            <span style="display: flex; align-items: center; gap: 4px; background: {{t.flameBg}}; color: {{t.flame}}; font-size: 14px; font-weight: 800; padding: 6px 10px; border-radius: 999px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3.3.4 1.5 1.5 2.8 2.5 2.8z"></path></svg>
              {{item.streak}}
            </span>
          </span>
          <span style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{item.week}}" as="day" hint-placeholder-count="7">
              <span style="display: flex; flex-direction: column; align-items: center; gap: 4px">
                <span style="width: 100%; height: 8px; border-radius: 999px; background: {{day.color}}"></span>
                <span style="font-size: 11px; font-weight: 700; color: {{t.muted}}">{{day.label}}</span>
              </span>
            </sc-for>
          </span>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main navigation" style="display: flex; justify-content: space-around; padding: 10px 12px 28px; background: {{t.surface}}; border-top: 1px solid {{t.border}}">
    <a href="{{nav.today}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 80px; min-height: 44px; text-decoration: none; color: {{t.muted}}; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      Today
    </a>
    <a href="{{nav.habits}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 80px; min-height: 44px; text-decoration: none; color: {{t.link}}; font-size: 12px; font-weight: 800">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
      Habits
    </a>
    <a href="{{nav.profile}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 80px; min-height: 44px; text-decoration: none; color: {{t.muted}}; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path></svg>
      Profile
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  tokens(dark) {
    return dark ? {
      bg: '#0F1117', surface: '#1A1D27', surface2: '#242836', text: '#F2F3F8', muted: '#A3A7BA', border: '#2C3040',
      link: '#A99FFF', flame: '#FFA36B', flameBg: '#3A2414', chipBg: '#F2F3F8', chipFg: '#1B1D2A', future: '#20232E'
    } : {
      bg: '#F4F6FB', surface: '#FFFFFF', surface2: '#F4F6FB', text: '#1B1D2A', muted: '#6B6F80', border: '#E6E8F0',
      link: '#5B4CF0', flame: '#B5470A', flameBg: '#FFF0E6', chipBg: '#1B1D2A', chipFg: '#FFFFFF', future: '#F4F6FB'
    };
  }
  hue(name, dark) {
    var H = {
      blue: ['#CFE4FF', '#1D5FBF', '#1C3557', '#8EC0FF', '#3B82F6'],
      yellow: ['#FFE8A3', '#8A5A00', '#4A3A0E', '#FFD66B', '#E0A800'],
      green: ['#C9F2DE', '#12704A', '#143D2C', '#6FE0A8', '#22A06B'],
      violet: ['#E5DCFF', '#5B4CF0', '#2E2766', '#B3A8FF', '#7A6CFF'],
      pink: ['#FFD6E0', '#B0264F', '#4A1A2A', '#FF8FB0', '#E0457B']
    }[name];
    return dark ? { tint: H[2], ink: H[3], bar: H[4] } : { tint: H[0], ink: H[1], bar: H[4] };
  }
  renderVals() {
    var self = this;
    var dark = (this.props.theme || 'light') === 'dark';
    var t = this.tokens(dark);
    var s = dark ? 'Dark' : '';
    var nav = { today: 'Main' + s + '.dc.html', habits: 'Habits' + s + '.dc.html', profile: 'Profile' + s + '.dc.html', habit: 'Habit' + s + '.dc.html', newHabit: 'NewHabit' + s + '.dc.html' };
    var labels = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
    function week(pattern, bar) {
      return labels.map(function (l, i) {
        return { label: l, color: pattern[i] === 1 ? bar : (pattern[i] === 0 ? t.border : t.future) };
      });
    }
    var list = [
      { name: 'Drink water', goal: '8 glasses a day', streak: '12', hue: 'blue', icon: 'M12 2.7l5.7 5.6a8 8 0 1 1-11.4 0z', p: [1, 1, 1, 1, 2, 2, 2] },
      { name: 'Read 20 minutes', goal: 'Before bed', streak: '5', hue: 'yellow', icon: 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5zM6.5 17A2.5 2.5 0 0 0 4 19.5 2.5 2.5 0 0 0 6.5 22H20v-5', p: [1, 1, 1, 1, 2, 2, 2] },
      { name: 'Go for a walk', goal: '30 minutes', streak: '3', hue: 'green', icon: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4', p: [0, 1, 1, 0, 2, 2, 2] },
      { name: 'Meditate', goal: '10 min in the morning', streak: '21', hue: 'violet', icon: 'M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10zM2 21c0-3 1.9-5.4 5.2-6', p: [1, 1, 1, 1, 2, 2, 2] },
      { name: 'No sugar', goal: 'All day', streak: '2', hue: 'pink', icon: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM4.9 4.9l14.2 14.2', p: [0, 1, 1, 0, 2, 2, 2] }
    ];
    return {
      t: t,
      nav: nav,
      habits: list.map(function (h) {
        var c = self.hue(h.hue, dark);
        return Object.assign({}, h, c, { week: week(h.p, c.bar) });
      })
    };
  }
}
</script>
</body>
</html>
